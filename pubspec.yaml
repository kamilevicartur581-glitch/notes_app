name: notes_app
description: Notes app with MVVM architecture
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Твои пакеты для работы с БД и UI
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  intl: ^0.19.0

  # Firebase (для ПР 11 и 12)
  firebase_core: ^3.6.0
  firebase_remote_config: ^5.1.3
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true